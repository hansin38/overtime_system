<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연장근로 신청 시스템</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- ⚠️ db(Firestore) 라이브러리 로드 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- display:none을 제거하여 페이지 접속 시 바로 신청서가 보이도록 설정 -->
    <div id="main-system" class="container">
        <!-- 1. 상단 네비게이션 영역 (.top-nav, .nav-link, .user-info-text 연동) -->
        <div class="top-nav" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; margin-bottom: 25px;">
            <!-- 서비스 전환 (로그인 유지한 채 이동) -->
            <div class="service-nav">
                <span class="nav-link" onclick="location.href = 'index.html'">☰ 메뉴</span>
                <span class="service-tab active">📝 연장근무</span>
                <span class="service-tab" onclick="location.href = 'leave/leave-apply.html'">🏖️ 연차신청</span>
            </div>

            <!-- 우측 상단 통합 정보 영역 (작성자 + 제출일자 + 로그아웃) -->
            <div style="text-align: right; line-height: 1.4;">
                <div style="font-size: 13px; color: #333; font-weight: bold;">
                    작성자: <span id="user-display">로드 중...</span> | 제출일자: <span id="top-today-date"></span>
                    <span class="nav-link" style="margin-left: 10px;" onclick="logoutUser()">로그아웃</span>
                </div>
            </div>
        </div>

        <!-- 제목 위아래 여백: 연차신청 화면(leave-apply.html)과 동일하게 맞춤 -->
        <div style="margin: 60px 0 50px 0;">
            <h2 style="margin: 0;">연장근로 신청</h2>
        </div>

        <!-- 2. 상단 버튼 제어 영역 (.btn-submit, .btn-batch-delete 연동) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; gap: 6px;">
                <button type="button" class="btn-submit" onclick="submitForm(event)">제출하기</button>
                <button type="button" class="btn-batch-delete" onclick="saveTemporary(event)">임시저장</button>
            </div>
            <div style="display: flex; gap: 6px;">
                <button type="button" class="btn-batch-delete" onclick="viewMyRequests()">제출내역조회</button>
                <button type="button" class="btn-batch-delete" onclick="viewTempRequests()">임시저장내역</button>
            </div>
        </div>
        
        <hr style="border: none; border-top: 1px solid #dee2e6; margin-bottom: 20px;">

        <!-- 3. 제목 입력 영역 (CSS의 input 기본 스타일 연동) -->
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <!-- 작성 월: 매월 1~5일은 지난달, 그 외는 이번 달이 기본 (달력 범위·제목이 따라 바뀜) -->
            <b style="white-space: nowrap;">작성 월:</b>
            <select id="ot-month" onchange="handleOtMonthChange(this)" style="margin: 0 20px 0 0; padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; height: 38px; cursor: pointer;"></select>
            <b style="white-space: nowrap;">제 목:</b>
            <input type="text" id="ot-title" placeholder="00월 연장근로일지 제출" style="margin: 0; flex-grow: 1;">
        </div>

        <hr style="border: none; border-top: 1px solid #dee2e6; margin-bottom: 20px;">

        <!-- 4. 테이블 조작 영역 (.summary-box, .status-badge 연동) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <!-- 삭제 버튼 -->
                <button type="button" class="btn-batch-delete" onclick="deleteCheckedRows()" style="margin: 0;">
                    삭제
                </button>        
                <!-- 초기화(⟳) 버튼: .btn-batch-delete 클래스를 사용하여 일체감 있게 정돈 -->
                <button type="button" class="btn-batch-delete" onclick="clearFormWithConfirm()" style="margin: 0; padding: 6px 12px;" title="작성내역 초기화">
                    ⟳
                </button>        
            </div>
            <!-- 총 시간 및 상태 뱃지 영역 -->
            <div class="summary-box" style="margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;">
                <span id="total-hours" style="font-weight: bold; font-size: 16px; color: #222;">0.0 시간</span>
                <!-- 고정OT 구분별 사용/한도 (연장·휴일·야간) -->
                <span id="ot-breakdown" style="font-size: 12px; font-weight: normal; color: #888;"></span>
                <span id="ot-status" class="status-badge under-ot" style="font-size: 14px;">고정OT 범위 내</span>
            </div>
        </div>

        <!-- 5. 신청 내역 테이블 (CSS의 table 기본 스타일 연동) -->
        <table id="ot-table">
            <thead>
                <tr>
                    <!-- 체크박스 너비 제어를 위한 nth-child CSS 연동을 위해 너비 하드코딩 제거 -->
                    <th><input type="checkbox" id="master-check" onclick="toggleAllCheckboxes(this)"></th>
                    <th>날짜</th>
                    <th>구분</th>
                    <th>시작</th>
                    <th>종료</th>
                    <th>사유</th>
                    <th>시간</th>
                </tr>
            </thead>
            <tbody id="ot-tbody"></tbody>
        </table>

        <!-- 행 추가 영역 (.row-control-area, .btn-add 혹은 .btn-batch-delete 연동) -->
        <div class="row-control-area">
            <button onclick="addRow()" class="btn-batch-delete" style="margin: 0;">+ 행 추가</button>
        </div>
        
        <!-- 👤 [마이 페이지용 내역 모달창] (.modal, .modal-content 클래스 연동) -->
        <div id="history-modal" class="modal">
            <div class="modal-content" style="max-width: 800px; width: 90%;">
                <h3 style="margin-bottom: 20px;">나의 제출 내역</h3>            
                <div id="history-list">
                    <table style="margin: 0;">
                        <thead id="modal-thead">
                            <tr>
                                <th style="width: 8%;"><input type="checkbox" id="modal-master-check"></th>
                                <th style="width: 42%;">제목</th>
                                <th style="width: 25%;">신청일/작성일</th>
                                <th style="width: 25%;">상태</th> 
                            </tr>
                        </thead>
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
                
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px; flex-wrap: nowrap;">
                    <div id="pagination-container" style="display: flex; align-items: center; gap: 4px;"></div>
                    <div id="modal-action-buttons" style="display: flex; gap: 6px;"></div>
                </div>

                <!-- 하단 상세 내역 영역 (인쇄 양식과 같은 연장근로 신청 확인서, employee.js의 renderOvertimeSheetHtml) -->
                <div id="detail-view-container" style="display: none; margin-top: 20px;">
                    <div class="print-paper" style="width: 100%; box-sizing: border-box; margin: 0 auto;">
                        <div id="detail-view-body"></div>
                    </div>
                </div>

                <!-- 닫기 버튼: .modal-content button 전용 CSS 상속받도록 클래스 걷어냄 -->
                <div style="text-align: center; margin-top: 20px;">
                    <!-- width: auto를 직접 넣어 전역 100% 스타일 무력화 -->
                    <button type="button" style="width: auto; padding: 8px 25px;" onclick="document.getElementById('history-modal').style.display='none'">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🖨️ 연장근로 신청서 인쇄 영역 (화면에는 안 보이고, 인쇄할 때만 style.css의 #print-modal 규칙으로 출력) -->
    <div id="print-modal" style="display: none;">
        <div class="print-paper">
            <div id="ot-print-body"></div>
        </div>
    </div>

    <script src="js/ot-rules.js"></script>
    <script src="js/employee.js"></script>
</body>
</html>
