<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사내 통합 관리 시스템</title>

    <!-- 기존 연장근무일지용 스타일 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- ✨ 새로 만든 포털 전용 스타일 추가 -->
    <link rel="stylesheet" href="css/style-portal.css">

    <!-- Firebase SDK (반드시 core-app이 가장 먼저 와야 합니다) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- 2. [로그인 후 메뉴 화면] 서비스 선택 -->
    <div id="portal-main-screen" style="display: none;">
        <div class="card">
            <h2>사내 통합 관리 시스템</h2>
            <p><b id="portal-user-name"></b>님, 이용하실 서비스를 선택해 주세요.</p>

            <div class="portal-btn-group">
                <!-- 연장근무 선택 버튼 -->
                <button class="btn-ot" onclick="selectSystem('ot')">
                    📝 연장근무일지
                </button>
                
                <!-- 연차신청 선택 버튼 -->
                <button class="btn-leave" onclick="selectSystem('leave')">
                    🏖️ 연차신청
                </button>
            </div>

            <span class="portal-logout" onclick="logoutUser()">로그아웃</span>
        </div>
    </div>


    <!-- 1. [처음에 뜨는 로그인 화면] (로그인 후 메뉴 화면으로 이동) -->
    <div id="login-container" class="login-container" style="display: none; max-width: 450px;">
        <!-- 사원 로그인 섹션 (관리자 로그인은 admin.html에서 별도 진행) -->
        <div id="login-section-user" class="card">
            <h2 style="margin-bottom: 5px;">사내 통합 관리 시스템</h2>
            <h3>사원 로그인</h3>
            <!-- autocomplete="username"과 "current-password"를 넣어 브라우저 경고 방지 및 입력 편의성 제공 -->
            <input type="text" id="login-name" placeholder="이름" autocomplete="username">
            <input type="password" id="login-phone" placeholder="휴대폰 뒷자리" autocomplete="current-password"
                   onkeydown="if (event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()">시스템 접속</button>
        </div>
    </div>

    <!-- 기존 employee.js 대신 index.js를 연결합니다 -->
    <script src="js/index.js"></script>

</body>
</html>
